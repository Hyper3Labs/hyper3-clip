# Ablation protocol (paper Sec. 5.1, Table 5).  One shared base run is
# trained for 80k steps with every query relation switched off, and each row
# then resumes that single checkpoint and runs to 100k steps, changing
# exactly one thing.  Every row therefore sees the same 80k steps of history
# and the same 20k steps of budget, and differs only in the named control.
#
# `training.scheduler_total_steps: 100000` keeps one cosine shape across the
# base run and every row, so resuming does not introduce an LR discontinuity.
# All rows keep `model.query_pooling: true` so the parameter layout -- and
# therefore the checkpoint -- is identical and the base checkpoint loads
# strictly into every row.
#
# base_80k: the shared starting point.  All three query relation weights are
# zero, so this is the model without the query hierarchy.

project:
  name: hyper3-clip
  experiment: ablation_base_80k
seed: 31
output_dir: runs/ablations/base_80k
model:
  vision_backbone: vit_base_patch16_224
  vision_global_pool: token
  vision_sincos2d_pos: true
  vision_norm_layer: layer_norm
  text_model_name: openai/clip-vit-base-patch32
  embed_dim: 512
  curv_init: 1.0
  learn_curv: true
  query_pooling: true
  query_num_heads: 8
  query_mlp_ratio: 4.0
  query_pooling_mode: conditioned
  query_parent_mode: 'true'
objective:
  entail_weight: 0.2
  inter_aperture_scale: 0.7
  intra_aperture_scale: 1.2
  calibration_alpha: 10.0
  stop_grad_calibration: true
  query_image_text_weight: 0.0
  visual_hierarchy_weight: 0.0
  text_hierarchy_weight: 0.0
  reverse_visual_order: false
training:
  total_steps: 80000
  scheduler_total_steps: 100000
  global_batch_size: 768
  grad_accum_steps: 1
  lr: 0.0005
  weight_decay: 0.2
  betas:
  - 0.9
  - 0.98
  warmup_steps: 4000
  amp: true
  max_grad_norm: 1.0
  log_interval: 20
  ckpt_interval: 10000
  resume: true
  resume_from: null
  find_unused_parameters: true
optimizer:
  no_decay_params:
  - global_logit_scale
  - local_logit_scale
  - global_local_logit_scale
  - visual_alpha
  - textual_alpha
  - log_curv
  eps: 1.0e-08
data:
  type: processed_grit
  tarfiles:
  - /path/to/grit-processed/shard-{000000..000999}.tar
  image_size: 224
  max_text_length: 77
  shuffle_buffer: 4000
  num_workers: 8
  pin_memory: true
  max_parts: 5
  train_transform: tight_crop_color_jitter_gray
  image_normalization: imagenet
  queries_enabled: true
  max_sentences: 5
  max_phrases: 30
  max_queries_per_image: 6
  use_text_boxes: true
